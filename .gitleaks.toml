title = "CloudPilot"

[extend]
useDefault = true

# Current-tree scan: placeholders only. Do not allowlist whole docs files.

[[rules]]
id = "placeholder-supabase-publishable"
description = "Documentation placeholders"
regex = '''sb_publishable_\.\.\.'''

[allowlist]
regexes = [
  '''sb_publishable_\.\.\.''',
  '''xoxb-example''',
  '''AKIAEXAMPLE''',
]
paths = [
  '''.*\.test\.ts$''',
  '''.*\.test\.tsx$''',
]
