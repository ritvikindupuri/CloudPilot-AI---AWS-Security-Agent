AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudPilot AI — read-only cross-account role. Requires a per-customer ExternalId
  (confused-deputy protection) and grants SecurityAudit + ReadOnlyAccess only.

Parameters:
  CloudPilotAwsAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: AWS account ID of the CloudPilot control plane (trusted principal).
  ExternalId:
    Type: String
    MinLength: 16
    MaxLength: 64
    NoEcho: true
    Description: Per-customer ExternalId generated by CloudPilot and stored server-side. Do not reuse across customers.
  RoleName:
    Type: String
    Default: CloudPilotReadOnlyRole
    Description: IAM role name CloudPilot will AssumeRole into.

Resources:
  CloudPilotReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudPilotAssumeRoleWithExternalId
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${CloudPilotAwsAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Tags:
        - Key: ManagedBy
          Value: CloudPilot
        - Key: Purpose
          Value: ReadOnlySecurityAudit

Outputs:
  RoleArn:
    Description: Role ARN to paste into CloudPilot
    Value: !GetAtt CloudPilotReadOnlyRole.Arn
  ExternalIdRequired:
    Description: This role cannot be assumed without the matching ExternalId
    Value: "sts:ExternalId is required"
