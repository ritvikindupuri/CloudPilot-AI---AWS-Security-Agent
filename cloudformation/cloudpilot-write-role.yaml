AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OPTIONAL CloudPilot AI write role. Deploy only if you want CloudPilot to apply
  approved remediations. Still requires sts:ExternalId. Privilege-escalation IAM
  APIs are denied. Mutating calls also require an in-app UI approval.

Parameters:
  CloudPilotAwsAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: AWS account ID of the CloudPilot control plane (trusted principal).
  ExternalId:
    Type: String
    MinLength: 16
    MaxLength: 64
    NoEcho: true
    Description: Per-customer ExternalId generated by CloudPilot and stored server-side.
  RoleName:
    Type: String
    Default: CloudPilotWriteRole
    Description: IAM role name CloudPilot will AssumeRole into for approved writes.

Resources:
  CloudPilotWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudPilotAssumeRoleWithExternalId
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${CloudPilotAwsAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: CloudPilotApprovedRemediation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOnly
                Effect: Allow
                Action:
                  - "*:Get*"
                  - "*:List*"
                  - "*:Describe*"
                  - "*:Head*"
                Resource: "*"
              - Sid: ApprovedRemediation
                Effect: Allow
                Action:
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketVersioning
                  - guardduty:CreateDetector
                  - guardduty:UpdateDetector
                  - securityhub:EnableSecurityHub
                  - cloudtrail:StartLogging
                  - logs:PutMetricFilter
                  - sns:Publish
                  - sns:CreateTopic
                  - sns:Subscribe
                Resource: "*"
              - Sid: DenyPrivilegeEscalation
                Effect: Deny
                Action:
                  - iam:CreateAccessKey
                  - iam:CreateLoginProfile
                  - iam:UpdateLoginProfile
                  - iam:AttachUserPolicy
                  - iam:AttachRolePolicy
                  - iam:AttachGroupPolicy
                  - iam:PutUserPolicy
                  - iam:PutRolePolicy
                  - iam:PutGroupPolicy
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:SetDefaultPolicyVersion
                  - iam:UpdateAssumeRolePolicy
                  - iam:PassRole
                  - iam:AddUserToGroup
                  - iam:CreateUser
                  - sts:AssumeRole
                Resource: "*"
      Tags:
        - Key: ManagedBy
          Value: CloudPilot
        - Key: Purpose
          Value: OptInApprovedWrites

Outputs:
  RoleArn:
    Description: Write role ARN to paste into CloudPilot (optional)
    Value: !GetAtt CloudPilotWriteRole.Arn
