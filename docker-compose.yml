# ── CloudPilot AI — Docker Compose ───────────────────────────────────────────
# Usage:
#   1. Copy .env.example to .env and add your ANTHROPIC_API_KEY
#   2. docker compose up --build
#   3. Open http://localhost:8080

services:
  cloudpilot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"   # Vite frontend
      - "54321:54321" # Deno backend gateway
    env_file:
      - .env
    environment:
      - VITE_SUPABASE_URL=http://localhost:54321
      - VITE_SUPABASE_PUBLISHABLE_KEY=mock-anon-key
      - SUPABASE_URL=http://localhost:54321
      - SUPABASE_PUBLISHABLE_KEY=mock-anon-key
    volumes:
      - cloudpilot-data:/app/data
      - ./local-server.ts:/app/local-server.ts:ro
      - ./supabase:/app/supabase:ro
    restart: unless-stopped

volumes:
  cloudpilot-data:
    driver: local
