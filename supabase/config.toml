[functions.aws-agent]
verify_jwt = true

[functions.aws-agent-tools]
verify_jwt = true

[functions.aws-agent-scanner]
verify_jwt = true

[functions.aws-agent-ops]
verify_jwt = true

# Cron/internal: authenticates with x-guardian-secret (constant-time compare). JWT would block pg_cron.
[functions.guardian-scheduler]
verify_jwt = false

# Event ingest: authenticates with x-guardian-secret (constant-time compare).
[functions.guardian-event-processor]
verify_jwt = false

[functions.aws-executor]
verify_jwt = true

[functions.stripe-checkout]
verify_jwt = true

# Stripe sends no JWT. Signature verification via STRIPE_WEBHOOK_SECRET is required.
[functions.stripe-webhook]
verify_jwt = false

[functions.webhook-notify]
verify_jwt = true

[functions.aws-exchange-credentials]
verify_jwt = true

[functions.aws-credential-vault]
verify_jwt = true

[functions.team-invite]
verify_jwt = true

[auth]
enable_signup = true

[auth.email]
enable_confirmations = false

